worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Run as unprivileged (read-only FS in the chart); these paths must
    # be /tmp-prefixed so we can run with a read-only root filesystem.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Don't advertise the nginx version in the Server header or on error
    # pages.
    server_tokens off;

    # Gzip for the SPA bundle. Production bundle is ~150-300 KB gzipped
    # for the initial route; keep it under FR-13's 500 KB cap.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080 default_server;
        server_name _;

        # Security headers. CSP locks the SPA to its own origin + the CP
        # API (same hostname per the platform's path-routing model), with
        # Google Fonts allow-listed for Inter + JetBrains Mono. If an
        # external OIDC IdP is added, extend connect-src / frame-src to it.
        #
        # nginx gotcha: add_header is NOT inherited into a location that
        # declares its own add_header. Both content locations below set
        # Cache-Control, which would otherwise DROP every security header
        # from the response (the SPA HTML would ship with Cache-Control
        # only). So these headers are ALSO repeated inside each content
        # location on purpose — do not "DRY" them away, or the SPA loses
        # its clickjacking + CSP protection.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Health probe (k8s readiness / liveness). Returns 200 with no
        # body; nginx is alive iff it serves this.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        root /usr/share/nginx/html;
        index index.html;

        # Static asset cache: hashed filenames from Vite get a long
        # immutable cache. Security headers repeated (see note above).
        location /assets/ {
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            try_files $uri =404;
        }

        # SPA history-mode fallback: any path that doesn't match a static
        # file gets index.html so React Router can resolve it client-side.
        # Security headers repeated (see note above) so the SPA HTML that
        # renders reveal values carries CSP + frame-ancestors.
        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
