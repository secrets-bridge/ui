worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Run as unprivileged (read-only FS in the chart); these paths must
    # be /tmp-prefixed so we can run with a read-only root filesystem.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Gzip + brotli for the SPA bundle. Production bundle is ~150-300
    # KB gzipped for the initial route; keep it under FR-13's 500 KB cap.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080 default_server;
        server_name _;

        # Security headers. CSP locks the SPA to its own origin + the
        # CP API (same hostname per the platform's path-routing model).
        # If/when an external OIDC IdP is added, extend connect-src and
        # frame-src to its origin.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Google Fonts is allow-listed for Inter + JetBrains Mono. CSS
        # comes from fonts.googleapis.com; font binaries come from
        # fonts.gstatic.com. If we self-host the fonts later, both
        # entries can be tightened back to 'self'.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Health probe (k8s readiness / liveness). Returns 200 with no
        # body; nginx is alive iff it serves this.
        location = /healthz {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # Static asset cache: hashed filenames from Vite get a long
        # immutable cache; index.html stays no-cache so the user always
        # picks up the latest deploy on their next page load.
        root /usr/share/nginx/html;
        index index.html;

        location /assets/ {
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            try_files $uri =404;
        }

        # SPA history-mode fallback: any path that doesn't match a
        # static file gets index.html so React Router can resolve it
        # client-side.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
    }
}
