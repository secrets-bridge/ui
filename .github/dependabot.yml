version: 2

# Weekly update PRs. Minor + patch bumps are grouped into one PR per
# ecosystem; majors still come as their own PRs so each breaking change
# gets a deliberate review (e.g. react-router 6 -> 7, tailwind 3 -> 4).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is the native port and drops the compiler API that
      # typescript-eslint needs; every typescript-eslint release still
      # declares typescript <6.1.0 (typescript-eslint#10940). Remove this
      # once a typescript-eslint release supports TS 7. See ui#125.
      - dependency-name: typescript
        versions: [">=7.0.0"]

  # Dockerfile base images are pinned as tag@digest; dependabot keeps
  # the digest fresh, which is how alpine CVE fixes land.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Odd node majors are never LTS; moving to the next LTS is a
      # deliberate change (also bump node-version in ci.yml).
      - dependency-name: node
        update-types: [version-update:semver-major]
      # Odd nginx minors are mainline, not stable; stay on the stable
      # line and move to the next stable on purpose.
      - dependency-name: nginx
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
